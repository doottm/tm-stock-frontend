<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>해주세요 - 스마트 재고관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .todo-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .todo-item.completed {
            opacity: 0.6;
        }
        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #94a3b8;
        }
        /* Glassmorphism subtle input */
        .input-focus-ring:focus {
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.3);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div class="w-full max-w-md mx-auto bg-white min-h-screen sm:min-h-0 sm:h-[800px] sm:mt-10 sm:rounded-3xl sm:shadow-xl flex flex-col overflow-hidden relative">
        
        <!-- Header -->
        <header class="bg-amber-500 text-white p-4 shadow-md relative z-10 shrink-0">
            <div class="flex items-center">
                <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-full bg-amber-600/50 hover:bg-amber-700 text-white mr-3 active:scale-95 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                    </svg>
                </a>
                <h1 class="text-xl font-bold flex-1 flex items-center gap-2">
                    📝 해주세요
                </h1>
                <div class="text-xs bg-amber-600/60 px-2.5 py-1.5 rounded-full font-bold shadow-inner" id="progressBadge">
                    0/0 완료
                </div>
            </div>
            <p class="text-amber-100 text-xs mt-2 font-medium">매장에 필요한 요청사항이나 주문필요사항 남겨주세요.</p>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto bg-slate-50/60 p-4 flex flex-col">
            <!-- Input Form Card -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-4 shrink-0">
                <form id="todoForm" class="space-y-3">
                    <div class="flex gap-2">
                        <input type="text" id="todoInput" placeholder="요청사항을 입력하세요... (예: 컵 홀더 채워주세요)" 
                               class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-400 input-focus-ring transition-all" required>
                        <button type="submit" class="btn-press bg-amber-500 hover:bg-amber-600 text-white font-bold text-sm px-4 rounded-xl transition-all flex items-center justify-center">
                            추가
                        </button>
                    </div>
                    <!-- priority selector -->
                    <div class="flex gap-2 items-center text-xs">
                        <span class="text-slate-400 font-medium">우선순위:</span>
                        <label class="flex items-center gap-1 cursor-pointer bg-slate-100 px-2.5 py-1.5 rounded-lg border border-slate-200 checked-sibling:bg-rose-50 hover:bg-slate-200 transition-all font-semibold" id="label-high">
                            <input type="radio" name="priority" value="high" class="sr-only">
                            <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>긴급
                        </label>
                        <label class="flex items-center gap-1 cursor-pointer bg-amber-50 px-2.5 py-1.5 rounded-lg border-2 border-amber-400 font-semibold transition-all text-amber-900" id="label-normal">
                            <input type="radio" name="priority" value="normal" class="sr-only" checked>
                            <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>주문
                        </label>
                        <label class="flex items-center gap-1 cursor-pointer bg-slate-100 px-2.5 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-200 transition-all font-semibold" id="label-low">
                            <input type="radio" name="priority" value="low" class="sr-only">
                            <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>기타
                        </label>
                    </div>
                </form>
            </div>

            <!-- List Container -->
            <div class="flex-1 flex flex-col justify-start">
                <!-- Empty State -->
                <div id="emptyState" class="hidden flex-1 flex-col items-center justify-center py-12 text-center">
                    <span class="text-5xl mb-3">🎉</span>
                    <h3 class="text-base font-bold text-slate-700 mb-1">모든 요청이 처리되었습니다!</h3>
                    <p class="text-xs text-slate-400 font-medium">새로운 요청사항을 남겨주세요.</p>
                </div>

                <!-- Todo List -->
                <ul id="todoList" class="space-y-2.5 pb-8">
                    <!-- Dynamic Items -->
                </ul>
            </div>
        </main>
        
        <!-- Summary Footer / Quick Cleanup -->
        <footer class="bg-white border-t border-slate-200 p-4 pb-8 sm:pb-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] shrink-0">
            <div class="flex justify-between items-center gap-4">
                <button id="btnClearCompleted" class="btn-press flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-sm py-3 rounded-xl transition-all">
                    완료 항목 일괄 삭제
                </button>
                <button id="btnResetAll" class="btn-press flex-1 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-sm py-3 rounded-xl transition-all">
                    전체 초기화
                </button>
            </div>
        </footer>
    </div>

    <script>
        // Config for Backend
        const API_BASE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:')
            ? 'http://localhost:3000'
            : 'https://tm-stock-server.onrender.com';

        // Storage Keys
        const STORAGE_KEY = 'tm_stock_todos';

        // State
        let todos = [];
        let currentUser = '관리자';

        // DOM Elements
        const todoForm = document.getElementById('todoForm');
        const todoInput = document.getElementById('todoInput');
        const todoList = document.getElementById('todoList');
        const emptyState = document.getElementById('emptyState');
        const progressBadge = document.getElementById('progressBadge');
        const btnClearCompleted = document.getElementById('btnClearCompleted');
        const btnResetAll = document.getElementById('btnResetAll');

        // Priority Styles mapping
        const priorityBadgeMap = {
            high: { bg: 'bg-rose-50', text: 'text-rose-700', dot: 'bg-rose-500', label: '긴급' },
            normal: { bg: 'bg-amber-50', text: 'text-amber-700', dot: 'bg-amber-500', label: '주문' },
            low: { bg: 'bg-slate-100', text: 'text-slate-600', dot: 'bg-slate-400', label: '기타' }
        };

        // Initialize
        function init() {
            // Load current user
            const userName = localStorage.getItem('user_name');
            if (userName) {
                currentUser = userName;
            }

            // Load from LocalStorage
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    todos = JSON.parse(stored);
                } catch(e) {
                    todos = [];
                }
            } else {
                // Default items if first time
                todos = [
                    { id: 1, text: '오픈 시 상품 쇼케이스 진열 상태 점검', completed: false, priority: 'high', creator: '트래블메이커', createdAt: Date.now() - 3600000 * 2 },
                    { id: 2, text: '마감 시 냉장실 온도 기록 필수', completed: true, priority: 'normal', creator: '매니저', createdAt: Date.now() - 3600000 * 5 }
                ];
                saveTodos();
            }

            // Priority Radio Labels UI Interaction
            const radios = document.querySelectorAll('input[name="priority"]');
            radios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    // Reset all styles
                    document.getElementById('label-high').className = 'flex items-center gap-1 cursor-pointer bg-slate-100 px-2.5 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-200 transition-all font-semibold';
                    document.getElementById('label-normal').className = 'flex items-center gap-1 cursor-pointer bg-slate-100 px-2.5 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-200 transition-all font-semibold';
                    document.getElementById('label-low').className = 'flex items-center gap-1 cursor-pointer bg-slate-100 px-2.5 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-200 transition-all font-semibold';

                    // Apply selected style
                    const selectedVal = e.target.value;
                    const labelId = `label-${selectedVal}`;
                    const targetLabel = document.getElementById(labelId);
                    if (selectedVal === 'high') {
                        targetLabel.className = 'flex items-center gap-1 cursor-pointer bg-rose-50 px-2.5 py-1.5 rounded-lg border-2 border-rose-400 font-semibold transition-all text-rose-900';
                    } else if (selectedVal === 'normal') {
                        targetLabel.className = 'flex items-center gap-1 cursor-pointer bg-amber-50 px-2.5 py-1.5 rounded-lg border-2 border-amber-400 font-semibold transition-all text-amber-900';
                    } else {
                        targetLabel.className = 'flex items-center gap-1 cursor-pointer bg-slate-200 px-2.5 py-1.5 rounded-lg border-2 border-slate-400 font-semibold transition-all text-slate-900';
                    }
                });
            });

            render();
        }

        // Save to LocalStorage
        function saveTodos() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        }

        // Date formatter (MM.DD HH:mm or '오늘 HH:mm')
        function formatDate(timestamp) {
            if (!timestamp) return '알 수 없음';
            const date = new Date(timestamp);
            const now = new Date();
            
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            
            if (date.toDateString() === now.toDateString()) {
                return `오늘 ${hours}:${minutes}`;
            }
            
            return `${month}.${day} ${hours}:${minutes}`;
        }

        // Render Todo items
        function render() {
            todoList.innerHTML = '';

            if (todos.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');

                // Sort: incomplete first, then by priority (high > normal > low), then latest first
                const sortedTodos = [...todos].sort((a, b) => {
                    if (a.completed !== b.completed) {
                        return a.completed ? 1 : -1;
                    }
                    const priorityWeight = { high: 3, normal: 2, low: 1 };
                    if (priorityWeight[a.priority] !== priorityWeight[b.priority]) {
                        return priorityWeight[b.priority] - priorityWeight[a.priority];
                    }
                    return b.createdAt - a.createdAt;
                });

                sortedTodos.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = `todo-item flex items-center justify-between bg-white rounded-xl p-3.5 shadow-sm border border-slate-100 ${todo.completed ? 'completed' : ''}`;
                    
                    const badge = priorityBadgeMap[todo.priority];
                    const creatorName = todo.creator || '알 수 없음';

                    li.innerHTML = `
                        <div class="flex items-center gap-3 flex-1 min-w-0 pr-2">
                            <button onclick="toggleTodo(${todo.id})" class="shrink-0 w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all ${todo.completed ? 'bg-amber-500 border-amber-500 text-white' : 'border-slate-300 hover:border-amber-400 bg-white'}" aria-label="완료 체크박스">
                                ${todo.completed ? `
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4">
                                        <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd" />
                                    </svg>
                                ` : ''}
                            </button>
                            <div class="flex flex-col min-w-0 gap-1">
                                <span class="todo-text text-sm font-semibold break-all leading-tight ${todo.completed ? 'text-slate-400' : 'text-slate-800'}">${escapeHtml(todo.text)}</span>
                                <div class="flex flex-wrap gap-1.5 items-center">
                                    <span class="inline-flex items-center gap-1 text-[10px] px-2 py-0.5 rounded-full font-bold ${badge.bg} ${badge.text}">
                                        <span class="w-1 h-1 rounded-full ${badge.dot}"></span>
                                        ${badge.label}
                                    </span>
                                    <span class="text-[10px] text-slate-400 font-medium">by ${escapeHtml(creatorName)} • ${formatDate(todo.createdAt)}</span>
                                </div>
                            </div>
                        </div>
                        <button onclick="deleteTodo(${todo.id})" class="btn-press shrink-0 w-8 h-8 rounded-lg hover:bg-rose-50 text-slate-400 hover:text-rose-500 flex items-center justify-center transition-all" aria-label="삭제">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                            </svg>
                        </button>
                    `;
                    todoList.appendChild(li);
                });
            }

            // Update Badge
            const completedCount = todos.filter(t => t.completed).length;
            progressBadge.textContent = `${completedCount}/${todos.length} 완료`;
            if (todos.length > 0 && completedCount === todos.length) {
                progressBadge.className = 'text-xs bg-emerald-500 text-white px-2.5 py-1.5 rounded-full font-bold shadow-inner';
            } else {
                progressBadge.className = 'text-xs bg-amber-600/60 px-2.5 py-1.5 rounded-full font-bold shadow-inner';
            }
        }

        // Add Todo
        todoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = todoInput.value.trim();
            if (!text) return;

            const priority = document.querySelector('input[name="priority"]:checked').value;
            
            const newTodo = {
                id: Date.now(),
                text: text,
                completed: false,
                priority: priority,
                creator: currentUser,
                createdAt: Date.now()
            };

            todos.push(newTodo);
            saveTodos();
            
            // 텔레그램 알림 발송 (백엔드 API 호출)
            fetch(`${API_BASE_URL}/api/notify-todo`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text: text,
                    priority: priority,
                    creator: currentUser,
                    date: formatDate(newTodo.createdAt)
                })
            }).catch(err => console.error('Telegram API Error:', err));

            todoInput.value = '';
            
            // Reset input focus styling
            todoInput.focus();
            
            render();
        });

        // Toggle Todo status
        window.toggleTodo = function(id) {
            todos = todos.map(todo => {
                if (todo.id === id) {
                    return { ...todo, completed: !todo.completed };
                }
                return todo;
            });
            saveTodos();
            render();
        };

        // Delete single Todo
        window.deleteTodo = function(id) {
            todos = todos.filter(todo => todo.id !== id);
            saveTodos();
            render();
        };

        // Clear completed
        btnClearCompleted.addEventListener('click', () => {
            const completed = todos.filter(t => t.completed);
            if (completed.length === 0) {
                alert('완료된 할 일이 없습니다!');
                return;
            }
            if (confirm('완료된 할 일을 모두 삭제하시겠습니까?')) {
                todos = todos.filter(todo => !todo.completed);
                saveTodos();
                render();
            }
        });

        // Reset all
        btnResetAll.addEventListener('click', () => {
            if (confirm('모든 요청사항을 지우고 초기화하시겠습니까?')) {
                todos = [];
                saveTodos();
                render();
            }
        });

        // Helper to prevent XSS
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Start
        init();
    </script>
</body>
</html>
