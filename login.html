<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로그인 - 스마트 재고관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl overflow-hidden">
        <div class="bg-blue-600 p-8 text-center flex flex-col items-center">
            <!-- 큼지막한 로고 (밝기를 0으로 만들고 반전시켜 흰색으로 변경) -->
            <img src="img/logo.png" alt="TM Logo" class="w-48 h-auto mb-6 brightness-0 invert opacity-90 drop-shadow-md">
            
            <h1 class="text-2xl font-bold text-white">TM재고관리</h1>
            <p class="text-blue-200 mt-1 text-sm">오늘도 고생 많으셨습니다. 감사합니다.</p>
        </div>
        
        <form id="loginForm" class="p-6 space-y-4">
            <div class="space-y-1">
                <label class="block text-sm font-bold text-slate-700">아이디</label>
                <input type="text" id="userId" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-3 shadow-sm transition-colors" required placeholder="아이디를 입력하세요">
            </div>
            <div class="space-y-1">
                <label class="block text-sm font-bold text-slate-700">비밀번호</label>
                <input type="password" id="userPw" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-3 shadow-sm transition-colors" required placeholder="비밀번호를 입력하세요">
            </div>
            
            <div id="errorMsg" class="text-red-500 text-sm font-bold hidden text-center pt-2"></div>
            
            <button type="submit" id="loginBtn" class="btn-press w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg rounded-xl px-4 py-3.5 shadow-lg shadow-blue-600/30 mt-4">
                로그인
            </button>
        </form>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
