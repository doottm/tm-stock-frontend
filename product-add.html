<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- [수정사항 2026-05-19] 1. 프론트엔드 품목 추가 폼에서 SKU 입력란 삭제 -->
    <title>새 품목 추가 - 스마트 재고관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div class="w-full max-w-md mx-auto bg-white min-h-screen sm:min-h-0 sm:h-[800px] sm:mt-10 sm:rounded-3xl sm:shadow-xl flex flex-col overflow-hidden relative">
        <header class="bg-blue-600 text-white p-4 flex items-center shadow-md relative z-10 shrink-0">
            <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-full bg-blue-700/50 hover:bg-blue-800 text-white mr-3 active:scale-95 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                </svg>
            </a>
            <h1 class="text-xl font-bold flex-1">➕ 새 품목 추가</h1>
        </header>

        <main class="flex-1 p-5 overflow-y-auto">
            <form id="productAddForm" class="space-y-4">
                <div class="space-y-1">
                    <label class="block text-sm font-bold text-slate-700">품목명</label>
                    <input type="text" id="itemName" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-3 shadow-sm" required placeholder="예: 삼겹살">
                </div>
                <div class="space-y-1">
                    <label class="block text-sm font-bold text-slate-700">카테고리</label>
                    <select id="category" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-3 shadow-sm" required>
                        <option value="">기존 카테고리 선택</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="block text-sm font-bold text-slate-700">단위</label>
                    <select id="unit" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-3 shadow-sm" required>
                        <option value="">기존 단위 선택</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="block text-sm font-bold text-slate-700">최소재고 (안전재고)</label>
                    <input type="number" id="minStock" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-3 shadow-sm" required value="0" min="0">
                </div>
                <div class="space-y-1">
                    <label class="block text-sm font-bold text-slate-700">보관 위치</label>
                    <select id="location" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-3 shadow-sm" required>
                        <option value="">기존 보관 위치 선택</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="block text-sm font-bold text-slate-700">거래처 (공급사)</label>
                    <select id="supplier" class="w-full bg-slate-50 border border-slate-300 text-slate-900 rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-3 shadow-sm" required>
                        <option value="">기존 거래처 선택</option>
                    </select>
                </div>
            </form>
            <div class="h-24"></div>
        </main>

        <div class="absolute bottom-0 left-0 w-full p-4 bg-white/90 backdrop-blur-md border-t border-slate-100 pb-8 sm:pb-4">
            <button type="submit" form="productAddForm" class="btn-press w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xl rounded-2xl px-5 py-4 shadow-lg shadow-blue-600/30">
                품목 추가하기
            </button>
        </div>

        <div id="loadingOverlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-600 mb-4"></div>
            <p class="text-lg font-bold text-slate-800">데이터를 불러오는 중입니다...</p>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/product-add.js"></script>
</body>
</html>
